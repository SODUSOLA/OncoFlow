# Rebuild from a clean state:
#   docker compose -f infra/docker-compose.yml down          # stop + remove containers (keeps pgdata volume)
#   docker compose -f infra/docker-compose.yml build --no-cache app
#   docker compose -f infra/docker-compose.yml up -d
# Add `-v` to `down` if you also want to wipe the Postgres volume and start the DB from scratch.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oncoflow
      POSTGRES_USER: oncoflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oncoflow_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncoflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_USER: oncoflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:-oncoflow_dev}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: oncoflow
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "100"
      DEFAULT_POOL_SIZE: "25"
      
      # Postgres 16 defaults to scram-sha-256 password storage; this image's own default
      # (auth_type=md5) can't complete a login against that and fails with "wrong password
      # type". Verified locally: without this, `drizzle-kit migrate` against :6432 never
      # gets past authentication.
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  clamav:
    image: clamav/clamav:stable
    # Published to the host so a locally-run (non-containerized) `npm run dev` API process can
    # reach clamd directly at localhost:3310 — the `app` service reaches it via the internal
    # Docker network (CLAMAV_HOST=clamav) and never needed this, but local host-based dev has
    # no such network to ride on.
    ports:
      - "3310:3310"
    healthcheck:
      # clamd's virus-DB load is slow on first boot — start_period gives it room before the
      # healthcheck starts counting failures against it.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://oncoflow:${POSTGRES_PASSWORD:-oncoflow_dev}@pgbouncer:6432/oncoflow
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_BASE_URL: ${MONNIFY_BASE_URL:-https://sandbox.monnify.com}
      MONNIFY_CONTRACT_CODE: ${MONNIFY_CONTRACT_CODE:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-oncoflow-uploads}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      VIDEO_SDK_KEY: ${VIDEO_SDK_KEY:-}
      CALL_PROVIDER_API_KEY: ${CALL_PROVIDER_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — see infra/Dockerfile's HEALTHCHECK comment (IPv6 loopback
      # resolves first inside the container, nginx only binds IPv4).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
