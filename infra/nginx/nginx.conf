events {
  worker_connections 1024;
  multi_accept on;
  use epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Security: strip spoofable identity headers from external clients ──
  # These are set ONLY by the application server after authenticating the session.
  # Any value arriving from the client is pure attacker-controlled input.
  map $http_upgrade $connection_upgrade {
    default  "upgrade";
    ""       "";
  }

  # ── Rate limiting zones ──
  limit_req_zone  $binary_remote_addr  zone=auth:10m   rate=5r/s;
  limit_req_zone  $binary_remote_addr  zone=api:10m    rate=100r/s;
  limit_req_zone  $binary_remote_addr  zone=burst:10m  rate=20r/s;

  # ── Upstream ──
  upstream app {
    server 127.0.0.1:3000;
    keepalive 64;
  }

  # ── Security: reject requests carrying client-supplied auth headers ──
  # These headers MUST NOT be present on external traffic.
  # They are set server-side after authentication succeeds.
  server {
    listen 8080 default_server;
    server_name _;

    # ── Strip and reject untrusted identity headers ──
    # If any external request carries these, drop it immediately.
    if ($http_x_user_id) {
      return 400;
    }
    if ($http_x_facility_id) {
      return 400;
    }
    if ($http_x_session_id) {
      return 400;
    }

    # ── Body size limits ──
    client_max_body_size 1m;
    client_body_buffer_size 128k;

    # ── Timeouts ──
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    send_timeout          30s;

    # ── Security headers ──
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-XSS-Protection          "0" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── CORS ──
    # In production, set to the specific frontend origin.
    # Never use "*" with credentials.
    set $cors_origin "";
    if ($http_origin ~* "^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$") {
      set $cors_origin $http_origin;
    }
    if ($http_origin ~* "^https://[a-z0-9-]+\.oncoflow\.com\.ng$") {
      set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers      "Content-Type, Authorization, X-Request-Id, Accept" always;
    add_header Access-Control-Allow-Credentials  "true" always;
    add_header Access-Control-Max-Age            "86400" always;

    # ── Preflight ──
    if ($request_method = OPTIONS) {
      return 204;
    }

    # ── Health checks (handled by nginx directly, no auth needed) ──
    location = /health {
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto $scheme;
      access_log off;
    }

    location = /health/ready {
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto $scheme;
      access_log off;
    }

    # ── API ──
    # limit_req's zone= must be a compile-time literal, not a variable — nginx refuses to start
    # otherwise ("zero size shared memory zone"). Two location blocks (most-specific-prefix wins)
    # replace the single dynamic-zone block that used to set $rate_limit_zone.
    location /auth/ {
      limit_req zone=auth burst=10 nodelay;

      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto $scheme;

      # Strip client-supplied identity headers before forwarding to app
      proxy_set_header X-User-Id     "";
      proxy_set_header X-Facility-Id "";
      proxy_set_header X-Session-Id  "";

      proxy_set_header X-Request-Id $request_id;

      proxy_buffer_size 4k;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;

      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
      proxy_next_upstream_tries 2;
    }

    location / {
      limit_req zone=api burst=10 nodelay;

      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For "";
      proxy_set_header X-Forwarded-Proto $scheme;

      # Strip client-supplied identity headers before forwarding to app
      proxy_set_header X-User-Id     "";
      proxy_set_header X-Facility-Id "";
      proxy_set_header X-Session-Id  "";

      proxy_set_header X-Request-Id $request_id;

      proxy_buffer_size 4k;
      proxy_buffers 8 16k;
      proxy_busy_buffers_size 32k;

      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
      proxy_next_upstream_tries 2;
    }
  }
}
